name: Bundle checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.12'
      - run: |
          command -v jq
          command -v shellcheck
          uv run tests/test_config.py
          bash -n skills/session-coordination/scripts/sessions
          shellcheck -S warning skills/session-coordination/scripts/sessions
          git diff --check
